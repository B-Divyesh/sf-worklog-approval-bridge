[package]
name = "worklog-approval-bridge"
version = "0.2.6"
description = "Local-first Git and calendar worklog approval app"
authors = ["Param Factory"]
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-worklog-approval-bridge"
edition = "2021"

[lib]
name = "worklog_approval_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The Git collector is deliberately usable in the clean worker that runs the
# registered privacy claims.  Only an installed desktop bundle needs Tauri's
# platform webview runtime and its native system libraries.
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", optional = true, features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
