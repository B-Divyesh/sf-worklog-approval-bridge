[package]
name = "worklog-approval-bridge"
version = "0.1.6"
description = "Local-first Git and calendar worklog approval app"
authors = ["Param Factory"]
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-worklog-approval-bridge"
edition = "2021"

[lib]
name = "worklog_approval_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
