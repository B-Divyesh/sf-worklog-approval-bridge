name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.2.3
      source_commit:
        description: Full immutable source commit to package and release
        required: true
      sign_release:
        description: Sign and notarize with the configured platform secrets
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_commit || github.sha) || github.ref }}
      - name: Record immutable source commit
        id: source
        shell: bash
        env:
          NOMINATED_COMMIT: ${{ inputs.source_commit }}
        run: |
          commit="$(git rev-parse HEAD)"
          if [ -n "$NOMINATED_COMMIT" ]; then
            [[ "$NOMINATED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            test "$commit" = "$NOMINATED_COMMIT"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packages
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Detect macOS signing and notarization
        id: macos-signing
        if: startsWith(matrix.os, 'macos')
        env:
          SIGN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release || false }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/signing-mode.mjs macos
      - name: Detect Windows signing credentials
        id: windows-signing
        if: startsWith(matrix.os, 'windows')
        env:
          SIGN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release || false }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: node scripts/signing-mode.mjs windows
      - name: Configure Windows signing certificate
        if: startsWith(matrix.os, 'windows') && steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\\worklog-bridge-signing.pfx", $bytes)
      - name: Build unsigned Tauri bundles
        if: ${{ !startsWith(matrix.os, 'macos') || steps.macos-signing.outputs.enabled != 'true' }}
        run: npm run build:desktop -- --target ${{ matrix.target }}
      - name: Build signed macOS bundles
        if: startsWith(matrix.os, 'macos') && steps.macos-signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:desktop -- --target ${{ matrix.target }}
      - name: Authenticode-sign Windows bundles
        if: startsWith(matrix.os, 'windows') && steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certificate = "$env:RUNNER_TEMP\\worklog-bridge-signing.pfx"
          Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -Include *.exe,*.msi | ForEach-Object {
            & signtool sign /fd SHA256 /f $certificate /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not sign $($_.FullName)" }
            & signtool verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($_.FullName)" }
          }
      - name: Verify macOS signatures and notarization tickets
        if: startsWith(matrix.os, 'macos') && steps.macos-signing.outputs.enabled == 'true'
        run: |
          find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name '*.app' -print0 | while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done
          find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print0 | while IFS= read -r -d '' dmg; do
            xcrun stapler validate "$dmg"
          done
      - name: Record bundle provenance
        run: node scripts/build-provenance.mjs "src-tauri/target/${{ matrix.target }}/release/bundle" "${{ matrix.label }}" "${{ steps.source.outputs.commit }}" "provenance-${{ matrix.label }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            provenance-${{ matrix.label }}.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_commit || github.sha) || github.ref }}
      - name: Record and validate release source
        id: source
        shell: bash
        env:
          NOMINATED_COMMIT: ${{ inputs.source_commit }}
        run: |
          commit="$(git rev-parse HEAD)"
          if [ -n "$NOMINATED_COMMIT" ]; then
            [[ "$NOMINATED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            test "$commit" = "$NOMINATED_COMMIT"
          fi
          configured_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$configured_version" = "${RELEASE_TAG#v}"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$commit"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Flatten release files
        run: |
          mkdir upload
          find release-assets -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} upload/ \;
          find release-assets -type f -name 'provenance-*.json' -exec cp {} upload/ \;
          find upload -maxdepth 1 -type f -name '* *' -print0 | while IFS= read -r -d '' file; do
            mv "$file" "${file// /.}"
          done
          node scripts/release-manifest.mjs upload "$RELEASE_TAG" "${{ steps.source.outputs.commit }}" "$GITHUB_REPOSITORY"
          rm upload/provenance-*.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.source.outputs.commit }}
          generate_release_notes: true
          files: upload/*
      - name: Verify published release provenance and checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            node scripts/verify-release.mjs --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --expected-commit "${{ steps.source.outputs.commit }}" && exit 0
            sleep 10
          done
          exit 1
